services:
  # PostgreSQL Database
  db:
    image: postgres:latest
    container_name: kanji-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kanji-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanji-backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - kanji-network
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed &&
             node dist/main"

  # Frontend Web Application
  frontend:
    build:
      context: ../kanji-web-fe
      dockerfile: Dockerfile
    container_name: kanji-frontend
    restart: always
    environment:
      API_URL: http://localhost:3000
    ports:
      - "8080:80"
    networks:
      - kanji-network
    depends_on:
      - backend

  # AI Server (Kanji Recognition)
  ai-server:
    build:
      context: ../cnn-kanji
      dockerfile: Dockerfile
    container_name: kanji-ai-server
    restart: always
    ports:
      - "8000:8000"
    networks:
      - kanji-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  kanji-network:
    driver: bridge

volumes:
  pgdata:
